<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا</title>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TY6ZGKB8WK"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-TY6ZGKB8WK');
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #4a5568;
            --accent-color: #3182ce;
            --bg-color: #f7fafc;
            --card-bg: #ffffff;
            --text-color: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-container {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .greeting {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--primary-color);
        }

        .subtitle {
            font-size: 1rem;
            color: #718096;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group i {
            position: absolute;
            right: 15px;
            top: 43px;
            color: #a0aec0;
        }

        .form-control {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.2s;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-color);
        }

        textarea.form-control {
            height: 120px;
            resize: none;
        }

        .btn-submit {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background-color: #2b6cb0;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .success-message {
            display: none;
            color: #38a169;
            background-color: #f0fff4;
            border: 1px solid #c6f6d5;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <div class="greeting" id="greetingText">مرحباً بك</div>
        <p class="subtitle">يسعدنا تواصلك معنا في أي وقت</p>

        <form id="contactForm">
            <div class="form-group">
                <label for="name">الاسم</label>
                <i class="fa-solid fa-user"></i>
                <input type="text" id="name" class="form-control" placeholder="أدخل اسمك الكريم" required>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" class="form-control" placeholder="example@domain.com" required>
            </div>

            <div class="form-group">
                <label for="message">رسالتك</label>
                <i class="fa-solid fa-comment-dots" style="top: 43px;"></i>
                <textarea id="message" class="form-control" placeholder="اكتب رسالتك هنا..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">إرسال الرسالة</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>

        <div class="success-message" id="successMsg">
            <i class="fa-solid fa-circle-check"></i> تم إرسال رسالتك بنجاح! شكراً لك.
        </div>
    </div>

    <script>
        // 1. تحديد عبارة الترحيب تلقائياً بناءً على توقيت جهاز الزائر
        function setGreeting() {
            const hours = new Date().getHours();
            const greetingText = document.getElementById('greetingText');
            
            if (hours >= 5 && hours < 17) {
                greetingText.innerHTML = 'طاب صباحك ☀️';
            } else {
                greetingText.innerHTML = 'طاب مساؤك 🌙';
            }
        }
        
        setGreeting();

        // 2. معالجة النموذج ومحاكاة الإرسال بنجاح
        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const successMsg = document.getElementById('successMsg');

            submitBtn.disabled = true;
            btnText.innerText = 'جاري الإرسال...';
            btnSpinner.style.display = 'block';
            successMsg.style.display = 'none';

            // محاكاة الانتظار لمدة ثانيتين ثم النجاح
            setTimeout(() => {
                submitBtn.disabled = false;
                btnText.innerText = 'إرسال الرسالة';
                btnSpinner.style.display = 'none';
                
                successMsg.style.display = 'block';
                document.getElementById('contactForm').reset();
            }, 2000);
        });
    </script>

</body>
</html>
